name: Build OBS Studio (Windows x64)

on:
  workflow_dispatch:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  BUILD_DIR: build_x64
  CONFIG: Release

jobs:
  build-windows:
    name: Build OBS Studio (Windows x64)
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Ensure version tags exist
        shell: bash
        run: |
          if ! git describe --tags >/dev/null 2>&1; then
            git tag "$(date -u +'%Y.%-m.%d')"
            echo "Created fallback version tag: $(date -u +'%Y.%-m.%d')"
          fi

          VERSION=$(git describe --tags --always --dirty)
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Version: ${VERSION}"

      - name: Cache prebuilt dependencies
        uses: actions/cache@v4
        with:
          path: .deps
          key: obs-deps-windows-x64-${{ hashFiles('CMakePresets.json') }}

      # ------------------------------------------------------------------
      # IMPORTANT:
      # Use the legacy Video Codec SDK 10 headers for OBS's native NVENC.
      #
      # Modern nv-codec-headers can require a much newer NVENC API/driver.
      # Kepler-era NVIDIA drivers need the older API definitions.
      # ------------------------------------------------------------------
      - name: Fetch legacy NVENC headers
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $repo = "$env:RUNNER_TEMP\nv-codec-headers"
          $inc  = "$repo\include"

          if (Test-Path $repo) {
            Remove-Item -Recurse -Force $repo
          }

          git clone `
            --depth 1 `
            --branch n10.0.26.0 `
            https://github.com/FFmpeg/nv-codec-headers.git `
            $repo

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to clone legacy nv-codec-headers"
          }

          $header = "$inc\ffnvcodec\nvEncodeAPI.h"

          if (-not (Test-Path $header)) {
            throw "Legacy nvEncodeAPI.h was not found: $header"
          }

          Write-Host "Legacy NVENC header:"
          Write-Host $header

          # Save the absolute include directory.
          $incNormalized = $inc.Replace('\', '/')
          "LEGACY_NVCODEC_INCLUDE=$incNormalized" >> $env:GITHUB_ENV

          # Save the exact header path too, for verification later.
          "LEGACY_NVENC_HEADER=$header" >> $env:GITHUB_ENV

      # ------------------------------------------------------------------
      # Configure
      # ------------------------------------------------------------------
      - name: Configure
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cmake --preset windows-x64 `
            -DCMAKE_COMPILE_WARNING_AS_ERROR=OFF `
            -DOBS_COMPILE_DEPRECATION_AS_WARNING=ON `
            -DENABLE_BROWSER=ON `
            -DENABLE_WEBRTC=ON `
            -DENABLE_PORTABLE_CONFIG=ON `
            -DENABLE_FFMPEG_NVENC=OFF `
            -DFFnvcodec_INCLUDE_DIR="$env:LEGACY_NVCODEC_INCLUDE"

          if ($LASTEXITCODE -ne 0) {
            throw "CMake configuration failed"
          }

      # ------------------------------------------------------------------
      # Verify CMake actually recorded the legacy include path.
      # ------------------------------------------------------------------
      - name: Verify legacy NVENC configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $cache = "$env:BUILD_DIR\CMakeCache.txt"

          if (-not (Test-Path $cache)) {
            throw "CMakeCache.txt not found"
          }

          $text = Get-Content $cache -Raw

          Write-Host "Checking CMake cache for legacy NVENC include path..."

          if ($text -notmatch [regex]::Escape($env:LEGACY_NVCODEC_INCLUDE)) {
            Write-Host "---- NVENC-related CMake cache entries ----"
            Get-Content $cache |
              Select-String -Pattern "nvcodec|NVENC|FFnvcodec" |
              ForEach-Object { Write-Host $_.Line }

            throw "Legacy NVENC include directory was NOT recorded by CMake"
          }

          Write-Host "OK: CMake recorded legacy NVENC headers"

      # ------------------------------------------------------------------
      # Build OBS.
      # ------------------------------------------------------------------
      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cmake --build --preset windows-x64 `
            --config $env:CONFIG `
            --parallel `
            --verbose `
            -- /consoleLoggerParameters:Summary /noLogo

          if ($LASTEXITCODE -ne 0) {
            throw "OBS build failed"
          }

      # ------------------------------------------------------------------
      # Verify that obs-nvenc was actually built.
      # ------------------------------------------------------------------
      - name: Verify obs-nvenc build output
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $candidates = @(
            "$env:BUILD_DIR\obs-plugins\obs-nvenc\Release\obs-nvenc.dll",
            "$env:BUILD_DIR\plugins\obs-nvenc\Release\obs-nvenc.dll",
            "$env:BUILD_DIR\rundir\obs-plugins\64bit\obs-nvenc.dll"
          )

          $found = $candidates |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (-not $found) {
            Write-Host "Could not find obs-nvenc.dll in expected build locations."
            Write-Host "Searching build tree..."

            Get-ChildItem `
              -Path $env:BUILD_DIR `
              -Filter "obs-nvenc.dll" `
              -Recurse `
              -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host $_.FullName }

            throw "obs-nvenc.dll was not produced"
          }

          Write-Host "OK: $found"

      # ------------------------------------------------------------------
      # Install
      # ------------------------------------------------------------------
      - name: Install
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cmake --install $env:BUILD_DIR `
            --prefix "$env:BUILD_DIR/install" `
            --config $env:CONFIG

          if ($LASTEXITCODE -ne 0) {
            throw "Install failed"
          }

      # ------------------------------------------------------------------
      # Verify the installed NVENC plugin.
      # ------------------------------------------------------------------
      - name: Verify installed NVENC plugin
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $dll = "$env:BUILD_DIR\install\obs-plugins\64bit\obs-nvenc.dll"

          if (-not (Test-Path $dll)) {
            throw "Installed obs-nvenc.dll was not found: $dll"
          }

          Write-Host "OK: installed obs-nvenc.dll"
          Write-Host $dll

      # ------------------------------------------------------------------
      # Package
      # ------------------------------------------------------------------
      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Push-Location $env:BUILD_DIR

          cpack -C $env:CONFIG

          if ($LASTEXITCODE -ne 0) {
            Pop-Location
            throw "CPack failed"
          }

          $zip = Get-ChildItem `
            -Filter 'obs-studio-*-windows-x64.zip' `
            -File |
            Select-Object -First 1

          if (-not $zip) {
            Pop-Location
            throw "CPack did not produce a Windows ZIP"
          }

          $out = "OBS-Studio-$env:VERSION-windows-x64.zip"

          Move-Item $zip.FullName "../$out"

          Pop-Location

          "PACKAGE=$out" >> $env:GITHUB_ENV

          Write-Host "Packaged: $out"
          Write-Host "Size: $([math]::Round((Get-Item $out).Length / 1MB, 1)) MB"

      # ------------------------------------------------------------------
      # Package smoke test.
      # ------------------------------------------------------------------
      - name: Smoke-test package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $listing = & 7z l -slt $env:PACKAGE | Out-String

          if ($LASTEXITCODE -ne 0) {
            throw "7z could not read the package"
          }

          $required = @(
            'bin/64bit/obs64.exe',
            'bin/64bit/obs.dll',
            'obs-plugins/64bit/obs-browser.dll',
            'obs-plugins/64bit/obs-ffmpeg.dll',
            'obs-plugins/64bit/obs-nvenc.dll',
            'bin/64bit/obs-nvenc-test.exe',
            'obs-plugins/64bit/obs-x264.dll',
            'obs-plugins/64bit/rtmp-services.dll',
            'obs-plugins/64bit/win-capture.dll',
            'obs-plugins/64bit/win-dshow.dll',
            'data/obs-studio/locale/en-US.ini'
          )

          $fail = $false

          foreach ($f in $required) {
            $pattern = 'Path = ' + [regex]::Escape($f.Replace('/', '\'))

            if ($listing -match $pattern) {
              Write-Host "OK: $f"
            }
            else {
              Write-Host "FAIL: $f missing"
              $fail = $true
            }
          }

          if ($fail) {
            throw "One or more required package files are missing"
          }

      # ------------------------------------------------------------------
      # Upload artifact.
      # ------------------------------------------------------------------
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-studio-${{ env.VERSION }}-windows-x64
          path: OBS-Studio-*-windows-x64.zip
          if-no-files-found: error

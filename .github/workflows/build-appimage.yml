name: Build OBS Studio (Linux AppImage)

on:
  workflow_dispatch:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  PRESET: ubuntu
  BUILD_DIR: build_ubuntu
  INSTALL_PREFIX: ${{ github.workspace }}/install
  APPDIR: ${{ github.workspace }}/AppDir

jobs:
  build-linux:
    name: Build OBS Studio (Linux x86_64)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake extra-cmake-modules ninja-build pkg-config clang clang-format build-essential curl ccache git zsh \
            libavcodec-dev libavdevice-dev libavfilter-dev libavformat-dev libavutil-dev \
            libswresample-dev libswscale-dev libx264-dev libcurl4-openssl-dev libmbedtls-dev \
            libgl1-mesa-dev libjansson-dev libluajit-5.1-dev python3-dev libx11-dev \
            libxcb-randr0-dev libxcb-shm0-dev libxcb-xinerama0-dev libxcb-composite0-dev \
            libxcomposite-dev libxinerama-dev libxcb1-dev libx11-xcb-dev libxcb-xfixes0-dev \
            swig libcmocka-dev libxss-dev libglvnd-dev libgles2-mesa-dev libwayland-dev \
            librist-dev libsrt-openssl-dev libpci-dev libpipewire-0.3-dev libqrcodegencpp-dev \
            uthash-dev libsimde-dev \
            qt6-base-dev qt6-base-private-dev qt6-svg-dev qt6-wayland qt6-image-formats-plugins \
            libasound2-dev libfdk-aac-dev libfontconfig-dev libfreetype6-dev libjack-jackd2-dev \
            libpulse-dev libsndio-dev libspeexdsp-dev libudev-dev libv4l-dev libva-dev libvlc-dev \
            libvpl-dev \
            libdrm-dev nlohmann-json3-dev libwebsocketpp-dev libasio-dev \
            libdatachannel-dev \
            file desktop-file-utils patchelf

      # OBS master uses Qt 6.7+ APIs (invokeMethod with member pointers),
      # which Ubuntu 24.04's Qt 6.4 lacks. Install a recent Qt instead.
      # If wayland modules ever fail here, fall back to -DENABLE_WAYLAND=OFF.
      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          host: linux
          target: desktop
          arch: linux_gcc_64
          dir: ${{ runner.temp }}/Qt
          cache: true
          cache-key-prefix: install-qt-linux-x86_64
          # Note: qtsvg is bundled with the base package in Qt >= 6.8
          modules: 'qtwaylandcompositor qtimageformats'

      - name: Install nv-codec-headers (required for NVENC)
        # SDK 10 headers: the legacy 470xx driver for Kepler GPUs only supports
        # NVENC API 10. obs-nvenc guards newer APIs via NVENCAPI_MAJOR_VERSION.
        run: |
          git clone --depth 1 --branch n10.0.26.0 https://github.com/FFmpeg/nv-codec-headers.git /tmp/nv-codec-headers
          sudo make -C /tmp/nv-codec-headers install PREFIX=/usr/local
          echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/usr/local/lib/x86_64-linux-gnu/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          pkg-config --modversion ffnvcodec

      - name: Ensure version tags exist
        run: |
          if ! git describe --tags >/dev/null 2>&1; then
            git tag "$(date -u +'%Y.%-m.%d')"
            echo "Created fallback version tag: $(date -u +'%Y.%-m.%d')"
          fi
          git describe --tags

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Configure ccache
        run: |
          ccache --set-config=max_size=1G
          ccache --set-config=compression=true
          ccache --zero-stats
          ccache --show-config | grep -E 'cache_dir|max_size|compression'

      - name: Download Chromium Embedded Framework
        run: |
          CEF_VERSION="6533"
          CEF_REVISION="6"
          CEF_DIR="${RUNNER_TEMP}/cef"
          mkdir -p "$CEF_DIR"
          cd "$CEF_DIR"
          curl -fL -o cef.tar.xz \
            "https://cdn-fastly.obsproject.com/downloads/cef_binary_${CEF_VERSION}_linux_x86_64_v${CEF_REVISION}.tar.xz"
          echo "7963335519a19ccdc5233f7334c5ab023026e2f3e9a0cc417007c09d86608146  cef.tar.xz" | sha256sum -c
          mkdir cef_root
          tar -xJf cef.tar.xz -C cef_root --strip-components 1
          echo "CEF_ROOT_DIR=${CEF_DIR}/cef_root" >> "$GITHUB_ENV"

      - name: Install nlohmann_json >= 3.11 (required by browser source)
        run: |
          # Ubuntu 24.04 ships nlohmann-json3-dev 3.10.5; obs-browser needs 3.11+.
          git clone --depth 1 --branch v3.11.3 https://github.com/nlohmann/json.git /tmp/nlohmann_json
          cmake -S /tmp/nlohmann_json -B /tmp/nlohmann_json/build \
            -DJSON_BuildTests=OFF -DCMAKE_BUILD_TYPE=Release
          sudo cmake --install /tmp/nlohmann_json/build

      - name: Configure (portable mode, NVENC + browser enabled)
        run: |
          # ffmpeg_nvenc is built against NVENC API 12 in Ubuntu's ffmpeg and
          # would always fail on the 470xx driver; native obs-nvenc handles it.
          cmake --preset ${{ env.PRESET }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_RELOCATABLE=ON \
            -DENABLE_PORTABLE_CONFIG=ON \
            -DCMAKE_INSTALL_PREFIX=${{ env.INSTALL_PREFIX }} \
            -DENABLE_BROWSER=ON \
            -DCEF_ROOT_DIR=${{ env.CEF_ROOT_DIR }} \
            -DENABLE_FFMPEG_NVENC=OFF \
            -DENABLE_AJA=OFF \
            -DENABLE_WEBRTC=ON \
            -DENABLE_JACK=ON \
            -DENABLE_CCACHE=ON \
            -DOBS_COMPILE_DEPRECATION_AS_WARNING=ON

      - name: Build
        run: |
          cmake --build ${{ env.BUILD_DIR }} --parallel $(nproc)
          ccache --show-stats

      - name: Install
        run: cmake --install ${{ env.BUILD_DIR }}

      - name: Package portable tarball
        run: |
          VERSION=$(git describe --tags --always --dirty)
          tar -czf "OBS-Studio-${VERSION}-linux-portable.tar.gz" -C "${{ env.INSTALL_PREFIX }}" .
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Package AppImage
        run: |
          set -euo pipefail

          mkdir -p "$APPDIR/usr"
          cp -a "${{ env.INSTALL_PREFIX }}/bin" "$APPDIR/usr/"
          cp -a "${{ env.INSTALL_PREFIX }}/share" "$APPDIR/usr/"
          cp -a "${{ env.INSTALL_PREFIX }}/lib" "$APPDIR/usr/"

          # Bundle CEF runtime so browser sources work. CEF loads its resource
          # files (icudtl.dat, *.pak, *.bin) from the same directory as
          # libcef.so; the obs-browser plugin overrides the locales directory
          # to a "locales" folder next to obs-browser.so.
          CEF_LIBDIR="$APPDIR/usr/lib"
          cp -a "$CEF_ROOT_DIR/Release/libcef.so" "$CEF_LIBDIR/"
          cp -a "$CEF_ROOT_DIR/Release/libEGL.so" "$CEF_LIBDIR/"
          cp -a "$CEF_ROOT_DIR/Release/libGLESv2.so" "$CEF_LIBDIR/"
          cp -a "$CEF_ROOT_DIR/Release/"*.bin "$CEF_LIBDIR/"
          cp -a "$CEF_ROOT_DIR/Resources/"*.pak "$CEF_LIBDIR/"
          cp -a "$CEF_ROOT_DIR/Resources/icudtl.dat" "$CEF_LIBDIR/"
          mkdir -p "$APPDIR/usr/lib/x86_64-linux-gnu/obs-plugins/locales"
          cp -a "$CEF_ROOT_DIR/Resources/locales/." "$APPDIR/usr/lib/x86_64-linux-gnu/obs-plugins/locales/"

          # Bundle Qt platform plugins so the AppImage is self-contained
          QT_PLUGINS_DIR=$(qmake6 -query QT_INSTALL_PLUGINS 2>/dev/null || find /usr/lib -type d -path '*qt6/plugins' | head -n1)
          mkdir -p "$APPDIR/usr/lib/qt6/plugins"
          for d in platforms imageformats iconengines xcbglintegrations platforminputcontexts platformthemes; do
            [ -d "$QT_PLUGINS_DIR/$d" ] && cp -a "$QT_PLUGINS_DIR/$d" "$APPDIR/usr/lib/qt6/plugins/"
          done

          # Bundle the Python standard library so the obspython scripting
          # module works (libpython3.12.so is bundled via ldd, but without
          # the stdlib the interpreter dies with "No module named 'encodings'")
          PYMAJOR=$(python3 -c 'import sys; print(sys.version_info.major)')
          PYMINOR=$(python3 -c 'import sys; print(sys.version_info.minor)')
          cp -a "/usr/lib/python${PYMAJOR}.${PYMINOR}" "$APPDIR/usr/lib/python${PYMAJOR}.${PYMINOR}"

          # Recursively bundle all shared library dependencies, excluding
          # glibc and graphics driver libraries that must come from the host
          declare -A SEEN
          copy_deps() {
            local lib="$1"
            [ -n "$lib" ] && [ -f "$lib" ] || return 0
            local base
            base="$(basename "$lib")"
            [ -z "${SEEN[$base]:-}" ] || return 0
            SEEN[$base]=1
            case "$base" in
              libc.so*|libm.so*|ld-linux*|libpthread*|libdl.so*|librt.so*|libresolv*|libnss_*|\
              libGL.so*|libEGL.so*|libGLESv1*|libGLESv2*|libOpenGL.so*|libglapi.so*|libgbm.so*|\
              libdrm*|libvulkan*|libnvidia*|libcuda*|libnvcuvid*|libnvoptix*|\
              libX*.so*|libxcb*|libxkbcommon*|libwayland*|libXau*|libXdmcp*|libxshmfence*)
                # GL/driver and X11/Wayland client stacks must come from the
                # host: bundling them breaks Mesa/glvnd vendor initialization
                return 0 ;;
            esac
            if [ "$(readlink -f "$lib")" != "$(readlink -f "$APPDIR/usr/lib/$base")" ]; then
              cp -L "$lib" "$APPDIR/usr/lib/"
            fi
            local dep
            for dep in $(ldd "$lib" 2>/dev/null | awk '/=> \// {print $3} /^[^ \t].*\.so/ {print $1}'); do
              copy_deps "$dep"
            done
          }

          copy_deps "$APPDIR/usr/bin/obs"
          while IFS= read -r -d '' plugin; do
            copy_deps "$plugin"
          done < <(find "$APPDIR/usr/lib" -name '*.so*' -print0)

          # Make sure obs and its plugins resolve bundled libs from AppDir.
          # The install layout nests libs under lib/<arch>-linux-gnu, so cover
          # every level via LD_LIBRARY_PATH in AppRun (rpath kept simple).
          LIB_SUBDIRS=$(find "$APPDIR/usr/lib" -mindepth 1 -maxdepth 1 -type d -printf '%f\n')
          RPATH_ARGS='$ORIGIN/../lib'
          for d in $LIB_SUBDIRS; do
            RPATH_ARGS="$RPATH_ARGS:\$ORIGIN/../lib/$d"
          done
          patchelf --set-rpath "$RPATH_ARGS" "$APPDIR/usr/bin/obs"
          while IFS= read -r -d '' plugin; do
            patchelf --set-rpath '$ORIGIN:$ORIGIN/..:$ORIGIN/../..' "$plugin" || true
          done < <(find "$APPDIR/usr/lib" -name '*.so*' -print0)

          # Desktop file and icons
          DESKTOP_FILE="$APPDIR/usr/share/applications/com.obsproject.Studio.desktop"
          ICON_FILE=$(find "$APPDIR/usr/share/icons/hicolor" -name 'com.obsproject.Studio.png' | sort -V | tail -n1)
          cp "$DESKTOP_FILE" "$APPDIR/com.obsproject.Studio.desktop"
          cp "$ICON_FILE" "$APPDIR/com.obsproject.Studio.png"
          cp "$ICON_FILE" "$APPDIR/.DirIcon"

          # AppRun wrapper
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          for d in "$HERE"/usr/lib/*/ "$HERE"/usr/lib; do
            export LD_LIBRARY_PATH="$d:${LD_LIBRARY_PATH:-}"
          done
          # The bundled curl is built against Ubuntu's CA path. On Fedora (and
          # other distros without /etc/ssl/certs/ca-certificates.crt), point it
          # at the local bundle so rtmp-services/service updates can verify TLS.
          for bundle in \
            /etc/pki/tls/certs/ca-bundle.crt \
            /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem \
            /etc/ssl/ca-bundle.pem; do
            if [ -r "$bundle" ]; then
              export CURL_CA_BUNDLE="$bundle"
              break
            fi
          done
          export QT_PLUGIN_PATH="$HERE/usr/lib/qt6/plugins:${QT_PLUGIN_PATH:-}"
          export PYTHONHOME="$HERE/usr"
          export PYTHONPATH="$HERE/usr/lib/python3.12:${PYTHONPATH:-}"
          exec "$HERE/usr/bin/obs" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          # Build the AppImage (extract-and-run avoids needing FUSE on the runner)
          curl -L -o appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          ARCH=x86_64 ./appimagetool.AppImage --appimage-extract-and-run "$APPDIR" \
            "OBS-Studio-${{ env.VERSION }}-linux-x86_64.AppImage"

      - name: Smoke-test AppImage
        run: |
          ./OBS-Studio-*-x86_64.AppImage --appimage-extract-and-run --version
          ./OBS-Studio-*.AppImage --appimage-extract >/dev/null
          PLUG_CHECK="squashfs-root/usr/lib/x86_64-linux-gnu/obs-plugins"
          test -f "$PLUG_CHECK/obs-browser.so" && echo "OK: obs-browser.so present" || { echo "FAIL: obs-browser.so missing"; exit 1; }
          test -f squashfs-root/usr/lib/libcef.so && echo "OK: libcef.so present" || { echo "FAIL: libcef.so missing"; exit 1; }
          test -f squashfs-root/usr/lib/x86_64-linux-gnu/obs-plugins/locales/en-US.pak && echo "OK: CEF locales present" || { echo "FAIL: CEF locales missing"; exit 1; }
          test -f "$PLUG_CHECK/obs-webrtc.so" && echo "OK: obs-webrtc.so present" || { echo "FAIL: obs-webrtc.so missing"; exit 1; }
          test -f "$PLUG_CHECK/linux-jack.so" && echo "OK: linux-jack.so present" || { echo "FAIL: linux-jack.so missing"; exit 1; }
          ldd "./$(ls OBS-Studio-*.AppImage | head -n1)" 2>/dev/null || true

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-studio-${{ env.VERSION }}-linux-x86_64-appimage
          path: OBS-Studio-*-x86_64.AppImage
          if-no-files-found: error

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-studio-${{ env.VERSION }}-linux-portable
          path: OBS-Studio-*-linux-portable.tar.gz
          if-no-files-found: error
